<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Прогноз погоды — актуальные метеоданные по городам">
  <title>Weather App</title>
  <link rel="icon" href="./images/favicon.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="body">
  <noscript>
    <div class="fallbackMessage">
      Внимание! На сайте отключен JavaScript. Для полной функциональности пожалуйста, включите его в настройках
      браузера.
    </div>
  </noscript>
  <header class="header">
    <a class="logo" href="index.html" aria-label="Переход на главную страницу">
      <svg class="logo__img" width="192" height="48" viewBox="0 0 192 48" aria-hidden="true">
        <use href="./sprites.svg#logo"></use>
      </svg>
    </a>
    <search>
      <form id="myForm" class="search" action="#" onsubmit="event.preventDefault();">
        <label class="visually-hidden" for="searchInput">Поиск по городу</label>
        <input class="search__input" id="searchInput" type="text" name="text" required placeholder="Поиск по городу"
          autocomplete="off">
        <button class="search__submit" id="cross" type="button" aria-label="Очистить поле поиска">
          <svg class="search__icon search__icon--cross" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <use href="./sprites.svg#cross"></use>
          </svg>
        </button>
        <svg class="search__icon search__icon--loupe" id="loupe" width="24" height="24" viewBox="0 0 24 24">
          <use href="./sprites.svg#loupe"></use>
        </svg>
      </form>
    </search>
  </header>
  <main>
    <div class="container">
      <h1 class="visually-hidden">Прогноз погоды на неделю</h1>
      <section class="weather">
        <h2 class="visually-hidden">Прогноз погоды на сегодня</h2>
        <div class="weather__card">
          <h3 class="weather__city">Москва</h3>
          <time class="weather__day" datetime="2024-01-06">Суббота, 06 января</time>
          <time class="weather__time" datetime="11:29">11:29</time>
        </div>
        <div class="weather__temp">
          <span class="weather__temp-value">-7°</span>
        </div>
        <div class="weather__details">
          <div class="weather__state">
            <img class="weather__state-icon" src="./images/weather-conditions/broken-clouds.png" width="24" height="24"
              alt="Облачно">
            <span class="weather__state-description">Облачно</span>
          </div>
          <span class="weather__details-feeling">Ощущается как -11°</span>
        </div>
      </section>
      <section class="cards">
        <h2 class="visually-hidden">Прогноз погоды подробный на день</h2>
        <ul id="weatherCards" class="cards__list">
        </ul>
      </section>
    </div>

    <section class="slider">
      <h2 class="visually-hidden">Прогноз погоды с днями на выбор</h2>

      <div class="interval">
        <span class="interval__forecast" aria-hidden="true">Прогноз: </span>
        <ul class="interval__switch">
          <li class="interval__switch-item">
            <button id="btnHour" class="interval__switch-btn interval__switch-btn--active" type="button"
              aria-label="24 часа">
              на 24 часа
            </button>
          </li>
          <li class="interval__switch-item">
            <button id="btnDay" class="interval__switch-btn" type="button" aria-label="5 дней">
              на 5 дней
            </button>
          </li>
        </ul>
      </div>

      <div class="carousel">
        <button class="carousel__btn carousel__btn--left" type="button" aria-label="Кнопка влево">

        </button>
